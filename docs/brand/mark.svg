<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Curtain</title>
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1e1b"/><stop offset="1" stop-color="#120d0c"/></linearGradient>
    <linearGradient id="drapeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a1424"/><stop offset="1" stop-color="#b8293f"/></linearGradient>
    <linearGradient id="drapeR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#7a1424"/><stop offset="1" stop-color="#b8293f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c9"/><stop offset="1" stop-color="#f2b544"/></linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b544" stop-opacity="0.8"/><stop offset="1" stop-color="#f2b544" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <ellipse cx="512" cy="640" rx="330" ry="330" fill="url(#glow)"/>
    <!-- The lit doorway: the money moves when you walk through it. -->
    <path d="M408 1044L412 892H612L616 1044Z" fill="url(#spill)"/>
    <path d="M412 892V556a100 100 0 0 1 200 0v336z" fill="url(#door)"/>
    <!-- Drapes, drawn back and tied. -->
    <path d="M-20 -20H486C478 170 410 330 300 470C372 560 404 700 404 1044H-20Z" fill="url(#drapeL)"/>
    <path d="M1044 -20H538C546 170 614 330 724 470C652 560 620 700 620 1044H1044Z" fill="url(#drapeR)"/>
    <g fill="none" stroke="#5a0f1b" stroke-width="16" stroke-linecap="round" opacity="0.55">
      <path d="M120 230C150 420 170 640 150 1044"/>
      <path d="M250 230C280 330 270 420 250 470"/>
      <path d="M904 230C874 420 854 640 874 1044"/>
      <path d="M774 230C744 330 754 420 774 470"/>
    </g>
    <circle cx="300" cy="474" r="26" fill="#f2b544"/>
    <circle cx="724" cy="474" r="26" fill="#f2b544"/>
    <!-- Valance. -->
    <path d="M-20 -20H1044V176H1024a64 46 0 0 1 -128 0a64 46 0 0 1 -128 0a64 46 0 0 1 -128 0a64 46 0 0 1 -128 0a64 46 0 0 1 -128 0a64 46 0 0 1 -128 0a64 46 0 0 1 -128 0a64 46 0 0 1 -128 0Z" fill="#8e1b2c" stroke="#f2b544" stroke-width="12"/>
  </g>
</svg>
