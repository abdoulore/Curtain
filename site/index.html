<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curtain</title>
<meta name="description" content="Pay-on-entry tickets. If the curtain never rises, your money comes back.">
<style>
  :root { --bg: #f7f6f3; --ink: #1c1b19; --muted: #6b6860; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141312; --ink: #f1efe9; --muted: #a29e94; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, system-ui, sans-serif; padding: 24px 16px; }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Curtain</h1>
  <p>If the curtain never rises, your money comes back.</p>
  <p class="muted">Pay-on-entry tickets on Monad. Coming soon.</p>
</main>
</body>
</html>
