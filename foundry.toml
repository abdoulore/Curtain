[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
# Monad testnet runs Osaka, which includes the P-256 precompile at 0x100 (EIP-7951).
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

# Same code on a Prague EVM, where 0x100 is empty, so OZ P256 falls back to its Solidity verifier.
# FOUNDRY_PROFILE=noprecompile forge test -vv
[profile.noprecompile]
evm_version = "prague"

# Event windows are hours long, so validator timestamp drift of a few seconds does not matter.
[lint]
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
# Alchemy free tier: eth_getLogs is capped at 10 blocks and debug_* is unavailable.
monad_testnet = "https://monad-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
# Public endpoint: 50 rps, supports debug_traceTransaction.
monad_testnet_public = "https://testnet-rpc.monad.xyz"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
